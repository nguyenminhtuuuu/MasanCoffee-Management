<div class="container mt-4">
  <h2 class="text-primary mb-3">Bảng Thanh Toán Lương</h2>

  <p class="text-muted">Số dòng dữ liệu: {{ danhSachLuong.length }}</p>

  <table class="table table-bordered table-striped table-hover shadow-sm">
    <thead class="table-dark">
      <tr>
        <th>Mã NV</th>
        <th>Họ Tên</th>
        <th>Số giờ làm</th>
        <th>Hệ số lương</th>
        <th>Tổng Lương</th>
        <th>Chức vụ</th>
        <th>Thao Tác</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let nv of danhSachLuong">
        <td>NV-0{{ nv.maNhanVien }}</td>
        <td class="fw-bold">{{ nv.hoTenNhanVien }}</td>
        <td>{{ nv.tongGioLam }}h</td>
        <td>{{ nv.heSoLuong }}</td>
        <td class="text-danger fw-bold">{{ nv.tongLuong | number }}đ</td>
        <td>{{ nv.chucVu }}</td>
        <td>
          <button
            class="btn btn-sm btn-outline-success"
            [disabled]="!coTheThanhToan(nv)"
            (click)="thanhToan(nv)">
            {{ nv.daThanhToan ? 'Đã thanh toán' : (nv.tongLuong <= 0 ? 'Không thanh toán' : 'Thanh toán') }}
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
